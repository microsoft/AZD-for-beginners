name: microservices
metadata:
  template: microservices@0.0.1-beta

services:
  api-gateway:
    module: app/api-gateway
    project: ./src/api-gateway
    language: js
    host: containerapp
  
  product-service:
    module: app/product-service
    project: ./src/product-service
    language: python
    host: containerapp
